[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-guardian-x"
dynamic = ["version"]
description = "Plug-and-play shield and dev core: local-first repository security, runtime request guard, observability and governance (stdlib only)"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-OMEGA-GUARDIAN-X-Proprietary-Alpha"
license-files = ["LICENSE"]
authors = [{ name = "OMEGA GUARDIAN X Project" }]
keywords = ["security", "waf", "request-validation", "dependency-audit", "sbom", "devsecops", "observability", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
ogx = "ogx.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "ogx.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
