[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-guardian-x"
dynamic = ["version"]
description = "Plug-and-play shield and dev core: local-first repository security, runtime request guard, observability and governance (stdlib only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - see LICENSE" }
authors = [{ name = "OMEGA GUARDIAN X Project" }]
keywords = ["security", "waf", "request-validation", "dependency-audit", "sbom", "devsecops", "observability", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
ogx = "ogx.cli:main"

[tool.setuptools]
package-dir = {"" = "core"}

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.dynamic]
version = { attr = "ogx.__version__" }

[tool.setuptools.package-data]
"ogx.governance" = ["schema.sql"]
"ogx.ecosystem" = ["skillpacks/official/*/skill.json", "skillpacks/official/*/SKILL.md"]
